name: Hotstar Project CI/CD - Docker + ECR + ECS Deploy

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push to ECR & Deploy to ECS
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: latest
      ECS_CLUSTER: project4
      ECS_SERVICE: my-service
      EXECUTION_ROLE_ARN: arn:aws:iam::312846472889:role/ecsTaskExecutionRole-hotstar

    steps:
      # Step 1 - Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3 - Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4 - Create ECR repo if it doesn't exist
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY

      # Step 5 - Build Docker image
      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # Step 6 - Push Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 7 - Render ECS task definition dynamically
      - name: Render ECS Task Definition
        id: render-task-def
        run: |
          echo "Generating ECS task definition..."
          cat > task-def.json <<EOF
          {
            "family": "hotstar-task",
            "networkMode": "awsvpc",
            "executionRoleArn": "$EXECUTION_ROLE_ARN",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "containerDefinitions": [
              {
                "name": "hotstar-container",
                "image": "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 3000,
                    "hostPort": 3000,
                    "protocol": "tcp"
                  }
                ],
                "memory": 1024,
                "cpu": 512
              }
            ]
          }
          EOF
          echo "::set-output name=task-def::$(cat task-def.json)"

      # Step 8 - Deploy to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-def }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
