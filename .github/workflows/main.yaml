name: Hotstar Project CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install Dependencies
        run: npm install

      # CI=false disables ESLint blocking warnings
      - name: ⚙ Build React App
        run: CI=false npm run build

      - name: 🔐 Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: 🔑 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build Docker Image
        run: |
          IMAGE_TAG=$(date +%s)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build -t vcube-137:$IMAGE_TAG .

      - name: 🏷 Tag Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          docker tag vcube-137:${{ env.IMAGE_TAG }} \
          $ACCOUNT_ID.dkr.ecr.ap-south-2.amazonaws.com/vcube-137:${{ env.IMAGE_TAG }}

      - name: ⬆ Push Image to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          docker push $ACCOUNT_ID.dkr.ecr.ap-south-2.amazonaws.com/vcube-137:${{ env.IMAGE_TAG }}

      - name: 📝 Update ECS Task Definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s|<IMAGE>|$ACCOUNT_ID.dkr.ecr.ap-south-2.amazonaws.com/vcube-137:${{ env.IMAGE_TAG }}|g" task-definition.json

      - name: 🚀 Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
         task-definition: task-definition.json
         service: vcube-service
         cluster: vcube-137
         wait-for-service-stability: true

      # 7. Update kubeconfig for EKS
      - name: Update kubeconfig
        run: |
         aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --region ${{ secrets.AWS_REGION }}
          
    # 🚀 CREATE NAMESPACE IF NOT PRESENT
      - name: Apply namespace manifest
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml -n ${{ secrets.K8S_NAMESPACE }}
          kubectl apply -f k8s/service.yaml

    # 8. Deploy to EKS
      - name: Deploy to EKS
        run: |
         ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          kubectl set image deployment/Hotstar-Project-deployment \
            Hotstar-Project-container=$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -n ${{ secrets.K8S_NAMESPACE }}

          kubectl rollout status deployment/Hotstar-Project-deployment \
            -n ${{ secrets.K8S_NAMESPACE }} --timeout=200s


          
