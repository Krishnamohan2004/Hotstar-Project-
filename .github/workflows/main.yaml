name: React CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:

      # 1️⃣ Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3️⃣ Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Run Tests
      - name: Run Tests
        run: npm test -- --watchAll=false
        continue-on-error: true

      # 5️⃣ Build React App
      - name: Build Project
        run: npm run build


      # 6️⃣ SonarQube Scan (for React / JS)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=hotstar-react-app
            -Dsonar.sources=src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}

      # 7️⃣ Upload Build Artifact
      - name: Upload Build Folder
        uses: actions/upload-artifact@v3
        with:
          name: react-build
          path: build/
